<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="运动科学知识库">
<meta name="theme-color" content="#0E6E7A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230E6E7A'/%3E%3Cpath d='M22 34h56M22 50h56M22 66h36' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<title>运动科学知识库</title>
<style>
:root{--bg:#F3F5F7;--card:#fff;--text:#1F2937;--muted:#6B7280;--line:#E5E7EB;--accent:#0E6E7A;--accent2:#1F3A4D;--soft:#EAF3F4;--warn:#C0662A;--danger:#C0392B;--radius:16px;--shadow:0 1px 3px rgba(16,24,40,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.55;padding-bottom:88px;-webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:rgba(243,245,247,.96);backdrop-filter:blur(10px);padding:10px 2px 8px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:19px;font-weight:800;color:var(--accent2);white-space:nowrap}
.brand small{font-size:11px;color:var(--muted);font-weight:500;margin-left:6px}
.meta{font-size:11px;color:var(--muted);text-align:right}
.search{margin-top:8px;position:relative}
.search input{width:100%;font-size:15px;padding:10px 36px 10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;font-family:inherit;color:var(--text)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,110,122,.10)}
.search .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;display:none}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border:1px solid rgba(229,231,235,.7)}
h1{font-size:22px;margin:6px 0 4px;color:var(--accent2)}
h2{font-size:17px;margin:0 0 8px;color:var(--accent2)}
h3{font-size:14px;margin:14px 0 6px;color:var(--accent2)}
p{margin:0 0 8px}
.sub{font-size:12px;color:var(--muted)}
.small{font-size:11px;color:#9CA3AF}
.hero{background:linear-gradient(135deg,#1F3A4D,#0E6E7A);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
.hero h1{color:#fff;margin:0 0 6px}
.hero p{color:#D7EEF1;font-size:13px;margin:0}
.hero .stats{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.hero .stat b{display:block;font-size:20px;color:#fff}
.hero .stat span{font-size:10px;color:#BFE3E7}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);text-decoration:none;color:var(--text);display:block}
.dcard .ic{font-size:24px}
.dcard b{display:block;margin-top:6px;font-size:15px;color:var(--accent2)}
.dcard span{font-size:11px;color:var(--muted);display:block;margin-top:2px;line-height:1.45}
.note{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;background:#fff;text-decoration:none;color:var(--text);display:block}
.note .ntitle{font-weight:800;color:var(--accent2);font-size:15px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.note .nsum{font-size:12px;color:#4B5563;margin-top:5px;line-height:1.6}
.note .nmeta{margin-top:7px;font-size:11px;color:var(--muted)}
.badge{display:inline-block;border-radius:999px;padding:1px 7px;font-size:10px;font-weight:800;flex:none}
.badge.A{background:#E8F5E9;color:#2E7D32}
.badge.B{background:#FFF8E1;color:#8A6D1D}
.badge.C{background:#F3F4F6;color:#6B7280}
.badge.BC{background:#EAF3F4;color:#0E6E7A}
.badge.AB{background:#EAF3F4;color:#0E6E7A}
.tag{display:inline-block;background:var(--soft);color:var(--accent);border-radius:999px;padding:2px 8px;font-size:10px;font-weight:700;margin:2px 4px 2px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;color:var(--accent2);font-family:inherit;text-decoration:none}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.list{margin:0;padding-left:18px;font-size:13px;color:#374151;line-height:1.7}
.list li{margin-bottom:5px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--accent);text-decoration:none;margin:6px 0 10px;font-weight:700}
.sources{font-size:11px;color:var(--muted);line-height:1.7}
.sources li{margin-bottom:3px}
.related a{display:inline-block;margin:2px 4px 2px 0;font-size:12px;color:var(--accent);text-decoration:none;background:var(--soft);border-radius:999px;padding:3px 9px}
.notice{background:#FFF8ED;border:1px solid #F3D9B8;border-radius:12px;padding:10px 12px;font-size:12px;color:#7A4A1E;line-height:1.6;margin-bottom:12px}
.notice.red{background:#FBEAE8;border-color:#F3C9C4;color:#8E2B20}
.notice.blue{background:#EFF7F8;border-color:#CFE6E8;color:#0E5A63}
.article{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;background:#fff}
.article .atitle{font-weight:800;color:var(--accent2);font-size:14px;line-height:1.45}
.article .ameta{font-size:11px;color:var(--muted);margin:4px 0 6px}
.article .aabs{font-size:12px;color:#4B5563;line-height:1.6}
.article .alinks{font-size:11px;margin-top:7px}
.article .alinks a{color:var(--accent);text-decoration:none;margin-right:12px}
.cross-section{border-left:3px solid var(--accent);padding:6px 0 6px 11px;margin:12px 0}
.cross-section b{color:var(--accent2)}
.cross-section .body{font-size:13px;color:#374151;line-height:1.7}
.integrated{background:#F8FAFB;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;line-height:1.7;margin:10px 0}
.integrated b{color:var(--accent2)}
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:720px;display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
.tabs a{border:none;background:transparent;padding:6px 2px;border-radius:9px;color:#94A3B8;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none}
.tabs a .ic{font-size:18px;line-height:1}
.tabs a.active{color:var(--accent);background:var(--soft)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--accent2);font-weight:700;margin-bottom:5px}
input,select,textarea{width:100%;font-size:16px;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:none;font-family:inherit}
textarea{min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,110,122,.10)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:700;color:#fff;background:var(--accent);width:100%;font-family:inherit}
.btn.ghost{background:#fff;color:var(--accent2);border:1px solid var(--line)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.flow span{background:var(--soft);color:var(--accent2);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}
.flow i{color:var(--muted);font-style:normal}
.node{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#fff}
.node b{color:var(--accent2)}
.node .row{font-size:12px;color:#4B5563;line-height:1.6;margin:3px 0}
.node .row b{color:var(--accent2)}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.65;white-space:pre-wrap}
.msg.user{background:var(--soft);align-self:flex-end;max-width:92%}
.msg.bot{background:#fff;border:1px solid var(--line)}
.msg.err{background:#FBEAE8;color:#8E2B20;border:1px solid #F3C9C4}
.askbox{display:flex;gap:8px;align-items:flex-end}
.askbox textarea{flex:1;min-height:56px}
.askbox button{flex:none;width:auto;padding:10px 14px}
.footer{text-align:center;font-size:11px;color:#9CA3AF;padding:10px 0 6px}
.hr{height:1px;background:#EEF1F4;margin:12px 0}
@media print{.tabs,header,.noprint{display:none!important}body{padding:0;background:#fff}#app{max-width:none}.card{box-shadow:none;border:none;padding:6px 0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand-row">
      <div class="brand">运动科学知识库 <small>四学科 · 交叉</small></div>
      <div class="meta" id="updated">—</div>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="搜索笔记、交叉主题、文献…" autocomplete="off" oninput="onSearch(this.value)">
      <button class="clear" id="clearBtn" onclick="clearSearch()">✕</button>
    </div>
  </header>
  <main id="view"></main>
  <div class="footer">证据分级 · 来源可查 · 不替代医疗诊断</div>
</div>
<nav class="tabs">
  <a href="#/home" data-tab="home"><span class="ic">🧭</span>总览</a>
  <a href="#/disciplines" data-tab="disciplines"><span class="ic">📚</span>学科</a>
  <a href="#/cross" data-tab="cross"><span class="ic">🔗</span>交叉</a>
  <a href="#/daily" data-tab="daily"><span class="ic">📰</span>每日</a>
  <a href="#/ask" data-tab="ask"><span class="ic">💬</span>问答</a>
  <a href="#/about" data-tab="about"><span class="ic">⚖️</span>关于</a>
</nav>

<script src="data/kb.js"></script>
<script>
const KB = window.KB_DATA || {meta:{},disciplines:[],cross:[],latest:{articles:[]},journals:[]};
const DISC = {}; KB.disciplines.forEach(d=>DISC[d.id]=d);
const NOTES = {}; KB.disciplines.forEach(d=>d.notes.forEach(n=>{NOTES[n.id]={...n,discipline:d.id,disciplineName:d.name};}));
const CROSS = {}; (KB.cross||[]).forEach(c=>CROSS[c.id]=c);
const FL = (KB.fascia_lines && KB.fascia_lines.lines) || [];
const FL_BY_ID = {}; FL.forEach(l=>FL_BY_ID[l.id]=l);
const state = {q:'', disc:'all', ask:{key: localStorage.getItem('kb_deepseek_key') || '', messages: [], busy: false, model:'deepseek-chat', base:'https://api.deepseek.com/chat/completions'}};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function badge(ev){const k=String(ev||'C').replace('/','');return `<span class="badge ${k}">证据 ${esc(ev)}</span>`;}
function nCount(d){return (d.notes||[]).length;}
function noteById(id){return NOTES[id]||null;}
function relatedHTML(n){
  const ids=(n.related||[]).filter(id=>NOTES[id]||CROSS[id]);
  if(!ids.length)return '';
  return `<h3>相关笔记</h3><div class="related">${ids.map(id=>{
    const note=NOTES[id]; const cross=CROSS[id];
    if(note)return `<a href="#/n/${id}">${esc(note.title)}</a>`;
    if(cross)return `<a href="#/c/${id}">${esc(cross.title)}</a>`;
    return '';
  }).join('')}</div>`;
}
function sourcesHTML(arr){
  if(!arr||!arr.length)return '';
  return `<h3>来源</h3><ul class="sources">${arr.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
}
function noteCard(n){
  return `<a class="note" href="#/n/${n.id}"><div class="ntitle"><span>${esc(n.title)}</span>${badge(n.evidence)}</div><div class="nsum">${esc(n.summary)}</div><div class="nmeta">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></a>`;
}

/* ===================== 视图 ===================== */
function vHome(){
  const latest=(KB.latest&&KB.latest.articles)||[];
  return `<div class="hero"><h1>运动科学知识库</h1><p>运动解剖学 · 运动生理学 · 筋膜学 · 营养学<br>四学科分栏，互相串联；每天抓取顶级期刊，来源可查。</p>
    <div class="stats"><div class="stat"><b>${KB.meta.counts?KB.meta.counts.notes:Object.keys(NOTES).length}</b><span>核心笔记</span></div><div class="stat"><b>${(KB.cross||[]).length}</b><span>交叉主题</span></div><div class="stat"><b>${latest.length}</b><span>近期文献</span></div></div></div>
    <div class="card"><h2>四学科</h2><div class="grid">${KB.disciplines.map(d=>`<a class="dcard" href="#/d/${d.id}"><div class="ic">${d.icon||'📘'}</div><b>${esc(d.name)}</b><span>${nCount(d)} 篇笔记</span></a>`).join('')}</div></div>
    <div class="card"><h2>筋膜链深度专题</h2><p class="sub">6 条肌筋膜链，逐节点：构成、走向、易出问题的点、评估与解决。</p>${FL.map(l=>`<a class="note" href="#/fl/${l.id}"><div class="ntitle"><span>${esc(l.name)}</span><span class="tag">${esc(l.en)}</span></div><div class="nsum">${esc(l.tagline)}</div></a>`).join('')||'<p class="sub">暂无</p>'}<div class="small" style="margin-top:6px">筋膜链是模型（C 级证据），不是诊断标准。</div></div>
    <div class="card"><h2>交叉主题</h2>${(KB.cross||[]).map(c=>`<a class="note" href="#/c/${c.id}"><div class="ntitle"><span>${esc(c.title)}</span><span class="tag">四学科</span></div><div class="nsum">${esc(c.summary)}</div></a>`).join('')||'<p class="sub">暂无</p>'}</div>
    <div class="card"><h2>最新文献</h2>${latest.slice(0,3).map(a=>`<div class="article"><div class="atitle"><a href="${esc(a.url)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(a.title)}</a></div><div class="ameta">${esc(a.journal)} · ${esc(a.date)}</div></div>`).join('')||'<p class="sub">还没有抓取记录。运行 scripts/kb_update.py 或等待每日自动任务。</p>'}<div class="small" style="margin-top:6px">每日更新只保存原文标题/摘要/链接，不自动生成结论。</div></div>
    <div class="notice blue"><b>怎么用：</b>从「学科」看基础笔记；遇到具体问题看「交叉」；想追新文献看「每日」。每篇笔记都有证据等级与来源。</div>`;
}
function vDisciplines(){
  return `<div class="card"><h2>四学科</h2><p class="sub">先建立单学科框架，再用「交叉」把四门课串起来。</p><div class="grid">${KB.disciplines.map(d=>`<a class="dcard" href="#/d/${d.id}"><div class="ic">${d.icon||'📘'}</div><b>${esc(d.name)}</b><span>${nCount(d)} 篇笔记</span></a>`).join('')}</div></div>`;
}
function vDiscipline(d){
  if(!d)return `<div class="card">未找到学科。</div>`;
  return `<a class="back" href="#/disciplines">← 返回学科</a><div class="card"><h2>${d.icon||''} ${esc(d.name)}</h2><p class="sub">${esc(d.intro||'')}</p>${d.id==='fascia'?`<div class="notice blue"><b>深度专题：6 条筋膜链</b><br>从构成、走向到每个节点的评估与解决。<br><a class="chip on" href="#/fascia-lines" style="margin-top:8px;display:inline-block">打开筋膜链专题 →</a></div>`:''}</div>
  <div class="card"><h2>笔记 (${nCount(d)})</h2>${d.notes.map(noteCard).join('')||'<p class="sub">暂无</p>'}</div>`;
}
function vNote(n){
  if(!n)return `<div class="card">未找到笔记。</div>`;
  const d=DISC[n.discipline];
  return `<a class="back" href="#/d/${n.discipline}">← 返回${esc(d?d.name:'学科')}</a>
  <div class="card"><div class="sub">${esc(d?d.name:'')}</div><h1>${esc(n.title)}</h1><div style="margin:6px 0 10px">${badge(n.evidence)} ${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p>${esc(n.summary)}</p></div>
  <div class="card"><h2>关键点</h2><ul class="list">${(n.points||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${relatedHTML(n)}${sourcesHTML(n.sources)}</div>
  <div class="notice">证据等级 ${esc(n.evidence)}：A=指南/教科书/系统综述共识；B=单项研究/机制/综述；C=模型/假说/经验/证据有限。具体应用请结合个体情况。</div>`;
}
function vFasciaList(){
  return `<a class="back" href="#/d/fascia">← 返回筋膜学</a>
  <div class="card"><h2>6 条筋膜链</h2><p class="sub">逐节点拆解：构成、走向、易出问题的点、评估与解决。筋膜链是模型（C 级），不是诊断标准。</p>
  ${FL.map(l=>`<a class="note" href="#/fl/${l.id}"><div class="ntitle"><span>${esc(l.name)}</span><span class="tag">${esc(l.en)}</span></div><div class="nsum">${esc(l.tagline)}</div></a>`).join('')}</div>
  <div class="notice">看链条时，先看局部：关节活动度、神经症状、负荷史、红旗。链条解释的是“可能如何传导”，不是“一定是谁的错”。</div>`;
}
function vFasciaLine(l){
  if(!l)return '<div class="card">未找到筋膜链。</div>';
  const path=(l.path||[]).map((p,i)=>`<span>${esc(p)}</span>${i<(l.path||[]).length-1?'<i>→</i>':''}`).join('');
  const nodes=(l.nodes||[]).map(n=>`<div class="node"><b>${esc(n.name)}</b> ${badge(n.evidence)}
    <div class="row"><b>解剖：</b>${esc(n.anatomy)}</div>
    <div class="row"><b>作用：</b>${esc(n.role)}</div>
    <div class="row"><b>易出问题：</b>${(n.issues||[]).map(esc).join('；')}</div>
    <div class="row"><b>评估：</b>${(n.assessment||[]).map(esc).join('；')}</div>
    <div class="row"><b>解决：</b>${(n.solutions||[]).map(esc).join('；')}</div>
  </div>`).join('');
  return `<a class="back" href="#/fascia-lines">← 返回筋膜链</a>
  <div class="card"><div class="sub">${esc(l.en)}</div><h2>${esc(l.name)}</h2><p>${esc(l.overview)}</p>
    <h3>走向</h3><div class="flow">${path}</div>
    <h3>功能</h3><ul class="list">${(l.functions||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  </div>
  <div class="card"><h2>原理</h2><ul class="list">${(l.principles||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <div class="notice blue"><b>反推验证：</b>${esc(l.validation||'')}</div>
  </div>
  <div class="card"><h2>节点拆解</h2>${nodes}</div>
  <div class="card">${sourcesHTML(l.sources)}<div class="notice">${esc((KB.fascia_lines&&KB.fascia_lines.meta&&KB.fascia_lines.meta.caveat)||'筋膜链是模型，不是诊断标准。')}</div></div>`;
}
function vCrossList(){
  return `<div class="card"><h2>交叉主题</h2><p class="sub">同一问题，用四门学科分别解释，再整合成可执行方案。</p>${(KB.cross||[]).map(c=>`<a class="note" href="#/c/${c.id}"><div class="ntitle"><span>${esc(c.title)}</span><span class="tag">四学科</span></div><div class="nsum">${esc(c.summary)}</div></a>`).join('')||'<p class="sub">暂无</p>'}</div>`;
}
function vCross(c){
  if(!c)return `<div class="card">未找到交叉主题。</div>`;
  const secs=(c.sections||[]).map(s=>`<div class="cross-section"><b>${esc(s.title)}</b><div class="body">${esc(s.body)}</div></div>`).join('');
  return `<a class="back" href="#/cross">← 返回交叉</a><div class="card"><h2>${esc(c.title)}</h2><div style="margin:6px 0 10px">${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')} ${badge(c.evidence)}</div><p>${esc(c.summary)}</p></div>
  <div class="card"><h2>四学科视角</h2>${secs}</div>
  <div class="card"><h2>整合方案</h2><div class="integrated">${esc(c.integrated)}</div><h3>红旗 / 需要转诊</h3><ul class="list">${(c.redFlags||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="card">${sourcesHTML(c.sources)}<div class="notice">这是基于机制与临床推理的交叉分析，不是诊断算法；有红旗先就医。</div></div>`;
}
function articleHTML(a){
  const abs=a.abstract?esc(a.abstract.slice(0,360))+(a.abstract.length>360?'…':''):'（暂无摘要）';
  return `<div class="article"><div class="atitle"><a href="${esc(a.url)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(a.title)}</a></div>
  <div class="ameta">${esc(a.journal)} · ${esc(a.date)}${a.authors?' · '+esc(a.authors):''}</div>
  <div class="aabs">${abs}</div>
  <div class="alinks"><a href="${esc(a.url)}" target="_blank" rel="noopener">PMID ${esc(a.pmid)}</a>${a.doi?`<a href="https://doi.org/${esc(a.doi)}" target="_blank" rel="noopener">DOI</a>`:''}<a href="https://europepmc.org/article/MED/${esc(a.pmid)}" target="_blank" rel="noopener">Europe PMC</a><button class="chip" onclick="translateAbstract('${esc(a.pmid)}')">译</button></div><div id="tr_${esc(a.pmid)}" class="small" style="margin-top:6px"></div></div>`;
}
async function translateAbstract(pmid){
  const a=((KB.latest&&KB.latest.articles)||[]).find(x=>x.pmid===pmid);
  const el=document.getElementById('tr_'+pmid);
  if(!a||!el)return;
  if(!state.ask.key){alert('请先在「问答」页保存 DeepSeek API key，再使用翻译。');return;}
  const cached=localStorage.getItem('kb_tr_'+pmid);
  if(cached){el.textContent=cached;return;}
  el.textContent='翻译中…';
  try{
    const prompt='把以下运动科学英文摘要翻译成中文。保留专业术语，英文缩写首次出现时加中文；只翻译，不总结、不添加原文没有的内容。\n\n'+a.abstract;
    const res=await fetch(state.ask.base,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.ask.key},body:JSON.stringify({model:state.ask.model,messages:[{role:'user',content:prompt}],temperature:0.1,max_tokens:1200})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error((data.error&&data.error.message)||('HTTP '+res.status));
    const text=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'（无内容）';
    localStorage.setItem('kb_tr_'+pmid,text);
    el.textContent=text;
  }catch(e){el.textContent='翻译失败：'+e.message;}
}

function saveKey(){

function buildContext(q){
  const terms=q.toLowerCase().split(/[\s,，。；;、/]+/).filter(t=>t.length>=2);
  const hit=s=>{const t=String(s||'').toLowerCase();return t.includes(q.toLowerCase())||terms.some(x=>t.includes(x));};
  const notes=Object.values(NOTES).map(n=>{
    const text=[n.title,n.summary,...(n.points||[]),...(n.tags||[])].join(' ');
    let score=0; if(hit(n.title))score+=3; if(hit(n.summary))score+=2; if(terms.some(x=>text.toLowerCase().includes(x)))score+=1;
    return {n,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,5);
  const crosses=(KB.cross||[]).filter(c=>hit([c.title,c.summary,...(c.sections||[]).map(s=>s.body)].join(' '))).slice(0,2);
  const fl=(FL||[]).map(l=>({l,score:(l.nodes||[]).filter(n=>hit([n.name,n.anatomy,n.role,...(n.issues||[]),...(n.solutions||[])].join(' '))).length})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,2);
  const arts=((KB.latest&&KB.latest.articles)||[]).filter(a=>hit([a.title,a.abstract,a.journal].join(' '))).slice(0,3);
  let out='';
  notes.forEach(({n})=>{out+=`【笔记】${n.title}（证据 ${n.evidence}）\n${n.summary}\n关键点：${(n.points||[]).join('；')}\n来源：${(n.sources||[]).join('；')}\n\n`;});
  crosses.forEach(c=>{out+=`【交叉】${c.title}\n${c.summary}\n`+(c.sections||[]).map(s=>`${s.title}：${s.body}`).join('\n')+`\n\n`;});
  fl.forEach(({l})=>{out+=`【筋膜链】${l.name}（${l.en}）\n${l.overview}\n`+(l.nodes||[]).slice(0,4).map(n=>`${n.name}：${n.role}；易出问题：${(n.issues||[]).join('、')}；解决：${(n.solutions||[]).join('、')}`).join('\n')+`\n\n`;});
  arts.forEach(a=>{out+=`【文献】${a.title}（${a.journal} ${a.date}，PMID ${a.pmid}）\n${(a.abstract||'').slice(0,500)}\n\n`;});
  return out.slice(0,7000)||'（知识库中没有直接匹配的资料，请基于通用教科书共识回答，并明确说明证据不足。）';
}
async function askAgent(){
  const a=state.ask;
  const q=(a.input||'').trim();
  if(!q||a.busy)return;
  if(!a.key){alert('请先保存 DeepSeek API key');return;}
  a.messages.push({role:'user',content:q});
  a.input='';a.busy=true;render();
  try{
    const context=buildContext(q);
    const system=`你是“运动科学知识库”智能体。只使用下面资料和教科书级共识回答；不要编造文献、PMID或来源。资料不足时明确说“资料不足，以下是基于通用原理的推断”。
回答结构（中文）：
1. 先澄清/定位（1-2 句）
2. 机制：运动解剖学 / 运动生理学 / 筋膜学 / 营养与恢复（按相关度选，不要硬凑）
3. 成因、诱因、关联因素
4. 需要排除的红旗
5. 解决思路：减量/恢复/强化/负荷/营养/转诊
6. 证据与来源（引用资料中的标题/PMID；没有就写“通用教科书共识”）
7. 还需要补充的信息
要求：区分“可能/倾向”和“确定”；不下诊断；不推荐具体药物。\n\n资料：\n${context}`;
    const history=a.messages.slice(-6).map(m=>({role:m.role==='error'?'assistant':m.role,content:m.content}));
    const res=await fetch(a.base,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.key},body:JSON.stringify({model:a.model,messages:[{role:'system',content:system},...history],temperature:0.2,max_tokens:1600})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error((data.error&&data.error.message)||('HTTP '+res.status));
    const ans=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'（无内容）';
    a.messages.push({role:'assistant',content:ans});
  }catch(e){
    a.messages.push({role:'error',content:'调用失败：'+e.message+'\n\n检查：key 是否有效、网络是否可达 api.deepseek.com、浏览器是否允许跨域。'});
  }
  a.busy=false;render();window.scrollTo(0,document.body.scrollHeight);
}

  <div class="notice red">${esc(meta.disclaimer||'本知识库不构成医疗诊断或治疗建议。')}</div>`;

function vSearch(q){
  const s=q.toLowerCase();
  const notes=Object.values(NOTES).filter(n=>[n.title,n.summary,...(n.points||[]),...(n.tags||[])].join(' ').toLowerCase().includes(s));
  const crosses=(KB.cross||[]).filter(c=>[c.title,c.summary,...(c.tags||[])].join(' ').toLowerCase().includes(s));
  const arts=((KB.latest&&KB.latest.articles)||[]).filter(a=>[a.title,a.abstract,a.journal].join(' ').toLowerCase().includes(s)).slice(0,10);
  return `<div class="card"><h2>搜索：${esc(q)}</h2><p class="sub">笔记 ${notes.length} · 交叉 ${crosses.length} · 文献 ${arts.length}</p></div>
  ${notes.length?`<div class="card"><h2>笔记</h2>${notes.map(noteCard).join('')}</div>`:''}
  ${crosses.length?`<div class="card"><h2>交叉主题</h2>${crosses.map(c=>`<a class="note" href="#/c/${c.id}"><div class="ntitle"><span>${esc(c.title)}</span><span class="tag">四学科</span></div><div class="nsum">${esc(c.summary)}</div></a>`).join('')}</div>`:''}
  ${arts.length?`<div class="card"><h2>文献</h2>${arts.map(articleHTML).join('')}</div>`:''}
  ${(!notes.length&&!crosses.length&&!arts.length)?'<div class="card"><p class="sub">没有匹配结果。试试更短的关键词。</p></div>':''}`;
}

/* ===================== 路由 ===================== */
function parse(){
  const h=(location.hash||'').replace(/^#\/?/,'');
  return h?h.split('/'):['home'];
}
function setActive(tab){
  document.querySelectorAll('.tabs a').forEach(a=>a.classList.toggle('active',a.dataset.tab===tab));
}
function render(){
  const view=document.getElementById('view');
  const parts=parse();
  const tab=parts[0];
  if(state.q){view.innerHTML=vSearch(state.q);setActive(tab==='cross'?'cross':tab==='daily'?'daily':tab==='about'?'about':'home');return;}
  if(tab==='home'||tab==='')view.innerHTML=vHome();
  else if(tab==='disciplines')view.innerHTML=vDisciplines();
  else if(tab==='d')view.innerHTML=vDiscipline(DISC[parts[1]]);
  else if(tab==='n')view.innerHTML=vNote(NOTES[parts[1]]);
  else if(tab==='fascia-lines')view.innerHTML=vFasciaList();
  else if(tab==='fl')view.innerHTML=vFasciaLine(FL_BY_ID[parts[1]]);
  else if(tab==='cross')view.innerHTML=vCrossList();
  else if(tab==='c')view.innerHTML=vCross(CROSS[parts[1]]);
  else if(tab==='daily')view.innerHTML=vDaily();
  else if(tab==='ask')view.innerHTML=vAsk();
  else if(tab==='about')view.innerHTML=vAbout();
  else view.innerHTML=vHome();
  const active = (tab==='d'||tab==='n'||tab==='fascia-lines'||tab==='fl')?'disciplines':(tab==='c')?'cross':(tab==='home'||tab===''?'home':tab);
  setActive(active);
  const m=KB.meta||{};
  document.getElementById('updated').textContent='更新 '+(m.updated||(KB.latest&&KB.latest.updated)||'—');
}
function go(h){location.hash=h;}
function onSearch(v){
  state.q=v.trim();
  document.getElementById('clearBtn').style.display=state.q?'block':'none';
  render();
  if(!state.q)window.scrollTo(0,0);
}
function clearSearch(){state.q='';document.getElementById('q').value='';document.getElementById('clearBtn').style.display='none';render();}
window.addEventListener('hashchange',()=>{state.q='';const inp=document.getElementById('q');if(inp)inp.value='';document.getElementById('clearBtn').style.display='none';render();window.scrollTo(0,0);});
render();
</script>
