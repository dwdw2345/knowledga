name: Agent learning

on:
  schedule:
    # 每周一 07:00（北京时间）= 周日 23:00 UTC
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-kb-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate principle drafts (DeepSeek)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/agent_learn.py --limit 6

      - name: Build knowledge base
        run: python scripts/kb_build.py

      - name: Commit drafts
        run: |
          git config user.name "sports-kb-bot"
          git config user.email "sports-kb-bot@users.noreply.github.com"
          git add data/agent_drafts.json data/agent_seen.json data/kb.js data/kb.json
          if git diff --cached --quiet; then
            echo "No new drafts."
          else
            git commit -m "chore: weekly agent learning $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
